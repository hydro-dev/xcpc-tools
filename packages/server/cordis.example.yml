# xcpc-tools plugin configuration (cordis.yml)
#
# Presence of this file opts the process into loader mode: entries below are
# loaded through @cordisjs/plugin-loader instead of the builtin wiring.
# Remove the file (or pass --no-config) to boot the builtin way.
#
# Entry fields:
#   id       optional, stable identifier used in logs and error reports
#   name     plugin reference — `xcpc:` builtins, `./relative/path.js` files
#            (relative to THIS file's directory), or bare package names (dev
#            installs only — not usable from the single-file bundle)
#   config   object passed to the plugin
#   inject   service names that must be active before the plugin starts
#   disabled set true to skip the entry entirely (it stays listed in this
#            file but is never loaded — startup does not fail for it)
#
# Dependency declarations and liveness: for the boot-time check to see a
# dependency, declare it in the entry's `inject:` field above or as the
# plugin's static `exports.inject` object. Dependencies created with
# ctx.inject() INSIDE the plugin body run on child fibers the host cannot
# enumerate — an unsatisfiable one will NOT fail startup.
#
# Group entries (`group: true`) are not supported by this host; list entries
# at the top level instead. Nested includes (`name: cordis:include` with
# `config.path`) ARE supported and resolve relative paths against the
# including file's directory.
#
# Any failed entry aborts startup with exit code 1 and the config path.
#
# cordis.yml only decides what loads here; business configuration still
# lives in config.server.yaml / config.client.yaml (loaded from the working
# directory as before).

# Standard server setup (equivalent to the builtin boot):
# - id: core
#   name: xcpc:core

# Standard client setup:
# - id: client
#   name: xcpc:client

# A local plugin placed next to this file:
# - id: my-plugin
#   name: ./plugins/my-plugin.js

# A plugin that only starts once the http server is up:
# - id: late-plugin
#   name: ./plugins/late.js
#   inject:
#     server: true

# Temporarily disable an entry without deleting it:
# - id: flaky-plugin
#   name: ./plugins/flaky.js
#   disabled: true
